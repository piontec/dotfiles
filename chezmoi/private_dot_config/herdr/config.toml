onboarding = false

[keys]
new_tab = ["ctrl+t"]
close_tab = ["ctrl+w"]
next_tab = ["ctrl+l"]
previous_tab = ["ctrl+h"]
next_workspace = ["ctrl+j"]
previous_workspace = ["ctrl+k"]
new_workspace = ["ctrl+n"]
switch_tab = "alt+1..9"
# switch_workspace = "ctrl+shift+1..9"
focus_agent = "ctrl+1..9"
 
[[keys.command]]
key = "ctrl+g"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "ctrl+y"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+u"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+i"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+o"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"

[ui.toast]
delivery = "terminal"

[theme]
name = "dracula"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[experimental]
pane_history = false

[ui.sound]
enabled = false
