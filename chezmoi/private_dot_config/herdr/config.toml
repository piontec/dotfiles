onboarding = false

[keys]
new_tab = ["ctrl+t"]
close_tab = ["ctrl+w"]
next_tab = ["ctrl+u"]
previous_tab = ["ctrl+i"]
next_workspace = ["ctrl+y"]
previous_workspace = ["ctrl+o"]
new_workspace = ["ctrl+n"]
switch_tab = "alt+1..9"
# switch_workspace = "ctrl+shift+1..9"
focus_agent = "ctrl+1..9"
 
[[keys.command]]
key = "ctrl+g"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"

[ui.toast]
delivery = "terminal"

[[keys.command]]
key = "prefix+shift+b"          # toggle the docked beads sidebar
type = "plugin_action"
command = "herdr-beads.open-dock"

[[keys.command]]
key = "prefix+shift+k"          # toggle the floating beads board
type = "plugin_action"
command = "herdr-beads.open-board"

[[keys.command]]
key = "alt+i"
type = "plugin_action"
command = "codeforbreakfast.beady-eye.open"

[theme]
name = "dracula"
auto_switch = false

[ui]
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace", "git_status"],
  [{ token = "$topic", bold = true, dim = false }],
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
  [ { token = "agent", rules = [
        { equals = "claude-gs", fg = "#F80" }, 
        { equals = "claude-personal", fg = "#009" }
    ]}, 
    { token = "machine", dim = true, fg = "#fff", rules = [{ equals = "Local", fg = "#999" }, { equals = "Fedora", ignore_case = true, fg = "#51a2da" }] }],
]

[experimental]
pane_history = false

[ui.sound]
enabled = false
